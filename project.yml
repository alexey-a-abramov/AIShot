# XcodeGen spec for the AIShot app target.
#
# The generated `AIShot.xcodeproj` is NOT committed (see .gitignore) — regenerate
# it with:  brew install xcodegen && xcodegen generate
#
# The app links the local SwiftPM package (AIShotKit) which holds all testable
# engine code. Distribution is Developer ID, notarized, non-sandboxed.
name: AIShot

options:
  bundleIdPrefix: com.aishot
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  AIShotKit:
    path: .
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  LaunchAtLogin:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern
    from: "1.0.0"
  # Sparkle (full silent-install auto-update) is the documented production path
  # (see docs/RELEASING.md). The app ships a built-in, dependency-free update
  # *checker* (UpdateChecker) so it builds without Sparkle's binary artifact;
  # add Sparkle back here to enable in-place installs.

targets:
  AIShot:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources/Localizable.xcstrings
      # Offline help page, opened from the menu bar. A folder reference so it
      # lands at Contents/Resources/Help/ — a flat copy would collide with any
      # other index.html and break relative links if assets are ever added.
      - path: App/Resources/Help
        type: folder
    dependencies:
      - package: AIShotKit
        product: AIShotKit
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: LaunchAtLogin
        product: LaunchAtLogin
    settings:
      base:
        PRODUCT_NAME: AIShot
        PRODUCT_BUNDLE_IDENTIFIER: com.aishot.app
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Resources/AIShot.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        COMBINE_HIDPI_IMAGES: YES
    # Derive the build number (CFBundleVersion) from the git commit count so it
    # increments automatically on every commit instead of being a static "1".
    # MARKETING_VERSION stays the human-facing release version.
    postBuildScripts:
      - name: Set build number from git commit count
        basedOnDependencyAnalysis: false
        script: |
          set -e
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          count=$(git -C "${SRCROOT}" rev-list --count HEAD 2>/dev/null || true)
          if [ -n "${count:-}" ] && [ -f "$plist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${count}" "$plist"
            echo "AIShot build number set to ${count}"
          else
            echo "warning: build number not set (no git history?); keeping CURRENT_PROJECT_VERSION"
          fi
