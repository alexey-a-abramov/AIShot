# XcodeGen spec for the AIShot app target.
#
# The generated `AIShot.xcodeproj` is NOT committed (see .gitignore) — regenerate
# it with:  brew install xcodegen && xcodegen generate
#
# The app links the local SwiftPM package (AIShotKit) which holds all testable
# engine code. Distribution is Developer ID, notarized, non-sandboxed.
name: AIShot

options:
  bundleIdPrefix: com.aishot
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  AIShotKit:
    path: .
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  LaunchAtLogin:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern
    from: "1.0.0"
  # Sparkle (full silent-install auto-update) is the documented production path
  # (see docs/RELEASING.md). The app ships a built-in, dependency-free update
  # *checker* (UpdateChecker) so it builds without Sparkle's binary artifact;
  # add Sparkle back here to enable in-place installs.

targets:
  AIShot:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources/Localizable.xcstrings
      # Offline help page, opened from the menu bar. A folder reference so it
      # lands at Contents/Resources/Help/ — a flat copy would collide with any
      # other index.html and break relative links if assets are ever added.
      - path: App/Resources/Help
        type: folder
    dependencies:
      - package: AIShotKit
        product: AIShotKit
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: LaunchAtLogin
        product: LaunchAtLogin
    # CURRENT_PROJECT_VERSION comes from here so the Info.plist processor picks
    # it up; see the file's header for why a script phase can't do this.
    configFiles:
      Debug: Config/Version.xcconfig
      Release: Config/Version.xcconfig
    settings:
      base:
        PRODUCT_NAME: AIShot
        PRODUCT_BUNDLE_IDENTIFIER: com.aishot.app
        MARKETING_VERSION: "0.0.1"
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Resources/AIShot.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        COMBINE_HIDPI_IMAGES: YES
